# Runs on every pull request and every push to main: lint, type check and
# tests. Nothing here deploys - Vercel does that separately.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  # Tenant isolation, proven against the real schema: every migration loaded
  # into a throwaway Postgres, then two businesses checked against each other
  # on every table (supabase/tests/rls.sql). Needs no secrets or Supabase
  # project - it never touches real data.
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test-rls.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
