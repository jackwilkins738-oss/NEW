# Weekly dependency updates, grouped so it's one PR to review rather than a dozen. Security
# fixes arrive straight away whatever the schedule. CI (checks.yml) runs on each PR, so a
# green update can be merged with confidence and a red one shows exactly what broke.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
